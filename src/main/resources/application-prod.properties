# Profile de produção: PostgreSQL, estrutura criada só por migrações Flyway.
# URL, usuário e senha NÃO ficam em arquivo: vêm das variáveis de ambiente
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

# Custo do BCrypt em produção
habitattio.seguranca.bcrypt-custo=12

# Cookie de sessão só por HTTPS
server.servlet.session.cookie.secure=true

# Documentação da API: nada online em produção; a descrição vive só no repositório, em
# docs/api/openapi.yaml (specs/004-auto-docs-api, research R7). Sem mapeamento de recursos
# estáticos, /webjars/** (arquivos da Swagger UI) também não existe; a aplicação é só API REST.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.web.resources.add-mappings=false
