# Profile de produção: PostgreSQL, estrutura criada só por migrações Flyway.
# URL, usuário e senha NÃO ficam em arquivo: vêm das variáveis de ambiente
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
