spring.application.name=habitattio

# Configuração do Banco de Dados H2 (Modo PostgreSQL)
spring.datasource.url=jdbc:h2:mem:habitattiodb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações do Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Modo rápido (padrão): estrutura gerada pelo Hibernate; migrações só no profile prod
spring.flyway.enabled=false

# Porta da Aplicação
server.port=8080

# Actuator: só o endpoint de saúde, só com o estado geral; o Redis fica fora do cálculo
# (o starter continua no projeto). Vale nos dois modos (specs/002-dockerize-app, research R7).
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.redis.enabled=false
# Sem Kubernetes: os grupos liveness/readiness (ligados por padrão no Boot 4) não são expostos.
management.endpoint.health.probes.enabled=false

# Com o banco fora, o pedido de conexão desiste em 3s (padrão do Hikari: 30s). Assim o endpoint
# de saúde responde 503 logo, e as requisições não ficam penduradas (decisão do dono, 2026-10-30).
spring.datasource.hikari.connection-timeout=3000
