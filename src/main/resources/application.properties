spring.application.name=habitattio

# Configuração do Banco de Dados H2 (Modo PostgreSQL)
spring.datasource.url=jdbc:h2:mem:habitattiodb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações do Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Modo rápido (padrão): estrutura gerada pelo Hibernate; migrações só no profile prod
spring.flyway.enabled=false

# Porta da Aplicação
server.port=8080

# Custo do BCrypt (baixo no modo rápido/testes)
habitattio.seguranca.bcrypt-custo=10

# Sessão
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=lax
